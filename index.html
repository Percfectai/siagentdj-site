<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SI Agent DJ · DJ Perfect Live</title>
  <meta name="description" content="Tune in to DJ Perfect's live mix on SI Agent DJ. Drop a request and he'll keep spinning all night.">
  <link rel="icon" href="data:,">
  <style>
    :root { --purple:#7d5cff; --cyan:#00f0ff; --gold:#f2c230; --bg:#0b0716; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:#eee; font-family:"Segoe UI",Roboto,Arial,sans-serif; }
    body { overflow-x:hidden; }
    .club { position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
    .backdrop { position:fixed; inset:0; z-index:0; pointer-events:none; }
    .backdrop svg { width:100%; height:100%; display:block; }
    .beam { position:fixed; top:-10vh; width:16vw; height:120vh; z-index:0; pointer-events:none; opacity:.18; filter:blur(8px);
            background:linear-gradient(180deg, var(--purple), transparent 80%); transform-origin:50% 0; animation:sweep 7s ease-in-out infinite alternate; }
    .beam.b2 { left:70vw; background:linear-gradient(180deg, var(--cyan), transparent 80%); animation-duration:9s; animation-delay:-3s; }
    .beam.b1 { left:12vw; }
    @keyframes sweep { from { transform:rotate(-18deg); } to { transform:rotate(18deg); } }
    header { position:relative; z-index:2; width:100%; display:flex; justify-content:space-between; align-items:center; padding:14px 22px; }
    .logo { font-weight:900; letter-spacing:3px; font-size:20px; }
    .logo span { color:var(--cyan); }
    .live-pill { font-size:12px; font-weight:800; letter-spacing:1px; padding:6px 12px; border-radius:20px; border:1px solid #555; color:#aaa; background:rgba(0,0,0,.4); }
    .live-pill.ok { border-color:#ff2d55; color:#ff2d55; }
    .live-pill.ok::before { content:"● "; animation:blink 1.2s infinite; }
    .live-pill.warn { border-color:var(--gold); color:var(--gold); }
    @keyframes blink { 50% { opacity:.2; } }
    main { position:relative; z-index:2; width:100%; max-width:1100px; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr); gap:24px; padding:0 22px 40px; align-items:end; }
    @media (max-width:860px) { main { grid-template-columns:1fr; } }
    @media (max-width:560px) { .stage { transform:scale(.68); transform-origin:50% 100%; height:520px; margin-top:-120px; } }
    /* ---- stage: avatar over a CSS 3D booth ---- */
    .stage { position:relative; height:690px; perspective:900px; perspective-origin:50% 30%; }
    .avatar-wrap { position:absolute; left:50%; bottom:158px; width:340px; height:442px; transform:translateX(-50%); z-index:4; transform-origin:50% 100%; }
    .avatar-wrap svg, .avatar-wrap img { width:100%; height:100%; display:block; filter:drop-shadow(0 0 24px rgba(125,92,255,.55)); }
    .avatar-wrap #head { transform-box:view-box; transform-origin:200px 228px; }
    .booth { position:absolute; left:50%; bottom:0; width:520px; height:150px; transform:translateX(-50%); transform-style:preserve-3d; z-index:3; }
    .booth-top { position:absolute; left:0; right:0; bottom:148px; height:150px; background:linear-gradient(#262036,#17131f); border:2px solid #3a2f55;
                 transform-origin:50% 100%; transform:rotateX(72deg); display:flex; justify-content:space-between; padding:0 18px; align-items:center; border-radius:10px; }
    .platter { width:110px; height:110px; border-radius:50%; background:repeating-radial-gradient(circle,#111 0 3px,#1d1d1d 3px 5px); border:3px solid #444; position:relative;
               animation:spin 1.8s linear infinite; animation-play-state:paused; }
    .platter::after { content:""; position:absolute; inset:38%; border-radius:50%; background:var(--purple); box-shadow:0 0 0 3px var(--gold) inset; }
    .platter.on { animation-play-state:running; }
    .platter.d2::after { background:var(--cyan); }
    @keyframes spin { to { transform:rotate(360deg); } }
    .booth-front { position:absolute; left:0; right:0; bottom:0; height:150px; border-radius:0 0 14px 14px;
                   background:linear-gradient(180deg,#1b1530,#0f0b1a); border:2px solid #3a2f55; display:flex; flex-direction:column; align-items:center; justify-content:center;
                   box-shadow:0 0 40px rgba(125,92,255,.35), inset 0 -20px 40px rgba(0,240,255,.08); }
    .booth-front .brand { font-weight:900; letter-spacing:6px; font-size:26px; color:#fff; text-shadow:0 0 12px var(--purple); }
    .booth-front .brand b { color:var(--cyan); }
    .eqbars { display:flex; gap:4px; height:40px; align-items:flex-end; margin-top:10px; }
    .eqbars i { width:9px; background:linear-gradient(var(--cyan),var(--purple)); border-radius:2px; height:6px; transition:height .08s; }
    .bubble { position:absolute; left:50%; top:0; transform:translateX(-50%); max-width:92%; z-index:5; background:#fff; color:#1a1030; font-weight:700; padding:12px 16px;
              border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.4); font-size:15px; line-height:1.35; opacity:0; transition:opacity .25s; pointer-events:none; }
    .bubble.show { opacity:1; }
    .bubble::after { content:""; position:absolute; bottom:-10px; left:50%; border:10px solid transparent; border-top-color:#fff; border-bottom:0; transform:translateX(-50%); }
    /* ---- side panel ---- */
    .panel { background:rgba(16,12,28,.82); border:1px solid #33285a; border-radius:16px; padding:20px; backdrop-filter:blur(6px); }
    .panel h2 { margin:0 0 4px; font-size:13px; letter-spacing:2px; color:#a99cff; text-transform:uppercase; }
    .np-title { font-size:24px; font-weight:900; margin:4px 0; }
    .np-meta { color:#aaa; font-size:14px; }
    .np-meta b { color:var(--gold); }
    .np-next { margin-top:8px; color:#888; font-size:13px; min-height:1em; }
    .btns { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0; }
    button { font:inherit; font-weight:800; border-radius:10px; border:1px solid var(--cyan); background:#13202a; color:#fff; padding:11px 16px; cursor:pointer; letter-spacing:.5px; }
    button:hover { background:#173040; }
    button.primary { background:linear-gradient(90deg,var(--purple),#b14cff); border-color:transparent; }
    button.primary.listening { background:#2a1d40; border-color:var(--purple); }
    form { display:flex; flex-direction:column; gap:8px; }
    input { font:inherit; padding:11px 12px; border-radius:10px; border:1px solid #3a2f55; background:#0e0a18; color:#fff; }
    .hint { font-size:12px; color:#888; min-height:1em; }
    footer { position:relative; z-index:2; color:#666; font-size:12px; padding:0 0 20px; }
    footer a { color:#888; }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120626"/><stop offset=".6" stop-color="#3a1466"/><stop offset="1" stop-color="#5b1f8f"/></linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0c4a"/><stop offset="1" stop-color="#0b0716"/></linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#sky)"/>
      <!-- skyline -->
      <path fill="#22103d" d="M0 640 L0 520 L60 520 L60 470 L110 470 L110 540 L170 540 L170 430 L220 430 L220 500 L290 500 L290 560 L1300 560 L1300 480 L1350 480 L1350 410 L1400 410 L1400 500 L1460 500 L1460 450 L1520 450 L1520 530 L1600 530 L1600 640 Z"/>
      <!-- Brooklyn Bridge silhouette (simplified) -->
      <g fill="#170a2c" stroke="#170a2c">
        <rect x="0" y="600" width="1600" height="22"/>
        <path d="M430 600 L430 330 L455 300 L545 300 L570 330 L570 600 Z M462 600 L462 420 Q475 380 488 420 L488 600 Z M512 600 L512 420 Q525 380 538 420 L538 600 Z" fill-rule="evenodd"/>
        <path d="M1030 600 L1030 330 L1055 300 L1145 300 L1170 330 L1170 600 Z M1062 600 L1062 420 Q1075 380 1088 420 L1088 600 Z M1112 600 L1112 420 Q1125 380 1138 420 L1138 600 Z" fill-rule="evenodd"/>
      </g>
      <g fill="none" stroke="#2c1450" stroke-width="4">
        <path d="M0 470 Q250 600 470 305"/><path d="M530 305 Q800 600 1070 305"/><path d="M1130 305 Q1350 600 1600 470"/>
        <path d="M0 500 Q250 610 470 340" stroke-width="2"/><path d="M530 340 Q800 610 1070 340" stroke-width="2"/><path d="M1130 340 Q1350 610 1600 500" stroke-width="2"/>
      </g>
      <rect y="622" width="1600" height="278" fill="url(#water)"/>
    </svg>
  </div>
  <div class="beam b1"></div><div class="beam b2"></div>

  <div class="club">
    <header>
      <div class="logo">SI AGENT <span>DJ</span></div>
      <div id="live-status" class="live-pill">CONNECTING…</div>
    </header>

    <main>
      <section class="stage" aria-label="DJ Perfect in the booth">
        <div id="bubble" class="bubble" role="status" aria-live="polite"></div>
        <div id="avatar" class="avatar-wrap"></div>
        <div class="booth">
          <div class="booth-top"><div id="platter1" class="platter d1"></div><div id="platter2" class="platter d2"></div></div>
          <div class="booth-front"><div class="brand">DJ <b>PERFECT</b></div><div id="eqbars" class="eqbars"></div></div>
        </div>
      </section>

      <section class="panel">
        <h2>Now playing</h2>
        <div id="np-title" class="np-title">Waiting for the DJ…</div>
        <div id="np-meta" class="np-meta">&nbsp;</div>
        <div id="np-next" class="np-next"></div>
        <div class="btns">
          <button id="listen-btn" class="primary" type="button">▶ Tap to listen</button>
          <button id="intro-btn" type="button">🎤 Play intro</button>
        </div>
        <h2>Request a song</h2>
        <form id="req-form" autocomplete="off">
          <input id="req-song" name="song" maxlength="200" placeholder="Song or artist you want to hear" required>
          <input id="req-name" name="name" maxlength="40" placeholder="Your name (optional)">
          <button type="submit">Send request</button>
          <div id="req-hint" class="hint"></div>
        </form>
      </section>
    </main>
    <footer>© SI Agent DJ · Percfect AI · <a href="mailto:founder@percfectai.com">founder@percfectai.com</a></footer>
  </div>

  <script src="config.js"></script>
  <script type="module" src="listener.js"></script>
</body>
</html>
