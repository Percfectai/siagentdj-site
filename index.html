<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>siagentdj.com</title>
<meta name="description" content="siagentdj.com: The AI DJ agent that reads the room. Contact founder@percfectai.com"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:#eef4f9;background:#04090d;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 60vmax at 15% 10%,rgba(43,127,212,.35),transparent 60%),radial-gradient(50vmax 50vmax at 90% 90%,rgba(224,169,78,.25),transparent 60%),#04090d}
.grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(57,192,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(57,192,230,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 75%)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px}
.pill{font:600 12px Inter;letter-spacing:.18em;text-transform:uppercase;color:#39c0e6;border:1px solid rgba(57,192,230,.4);border-radius:999px;padding:6px 14px;margin-bottom:28px}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(2.2rem,8vw,5.5rem);margin:0;letter-spacing:.02em;background:linear-gradient(90deg,#ffeaa5,#e0a94e 40%,#39c0e6);-webkit-background-clip:text;background-clip:text;color:transparent}
p.tag{font-size:clamp(1.05rem,2.6vw,1.4rem);color:#9fb0c0;max-width:620px;margin:22px auto 36px;line-height:1.5}
a.cta{display:inline-block;padding:14px 28px;border-radius:12px;background:linear-gradient(90deg,#2b7fd4,#39c0e6);color:#04090d;font-weight:600;text-decoration:none;box-shadow:0 8px 30px rgba(57,192,230,.35);transition:transform .15s}
a.cta:hover{transform:translateY(-2px)}
footer{text-align:center;padding:22px;color:#5b6d7c;font-size:13px}footer a{color:#e0a94e;text-decoration:none}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<main>
  <div class="pill">A PercfectAI project</div>
  <h1>siagentdj.com</h1>
  <p class="tag">The AI DJ agent that reads the room.</p>
  <a class="cta" href="mailto:founder@percfectai.com">Contact founder@percfectai.com</a>
</main>
<footer>&copy; 2026 PercfectAI &middot; <a href="mailto:founder@percfectai.com">founder@percfectai.com</a></footer>
</body>
</html>
